<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<meta name="keywords" content="юрист Белгород, юридическая помощь, сопровождение бизнеса, юридические лица, ИП, арбитражный суд, защита прав потребителей, договоры, претензии, судебные документы">
<meta name="author" content="{{ site.author }}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/img/photo.jpg' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
</head>
<body>

{% include header.md %}

<main id="main">
{{ content }}
</main>

{% include footer.md %}

<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
