title: "Филин А.С. — юрист"
description: "Профессиональный юрист в Белгороде с опытом более 25 лет. Сопровождение коммерческой деятельности юридических лиц и ИП, подготовка документов, представительство в судах, защита прав потребителей."
author: "ИП Филин Александр Сергеевич"
lang: "ru"

# Адрес сайта: https://zakon-no.github.io/
# При переходе на свой домен: url: "https://afilin.ru"
url: "https://zakon-no.github.io"
baseurl: ""

exclude:
  - README.md
  - AGENTS.md
  - .gitignore
  - img
  - "Контент.docx"
  - "Договор оказания юридических услуг_шаблон.doc"
  - ".DS_Store"

markdown: kramdown
kramdown:
  auto_ids: false

# Адреса страниц без расширения: /privacy/, /offer/
permalink: pretty

# Блоки главной страницы. Каждый файл — самостоятельный блок <section>.
# output: false означает: файлы не публикуются как отдельные страницы,
# а используются только как источник текста.
collections:
  sections:
    output: false
